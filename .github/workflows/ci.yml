name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          VITE_API_URL: https://api.example.com/api/v1
          REQUIRE_API_URL: "true"

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pinfast-api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pinfast
          POSTGRES_PASSWORD: pinfast
          POSTGRES_DB: pinfast_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pinfast -d pinfast_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://pinfast:pinfast@localhost:5432/pinfast_test
      DIRECT_URL: postgresql://pinfast:pinfast@localhost:5432/pinfast_test
      TEST_DATABASE_URL: postgresql://pinfast:pinfast@localhost:5432/pinfast_test
      JWT_ACCESS_SECRET: ci-only-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pinfast-api/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm prisma:validate
      - run: pnpm typecheck
      - run: pnpm test
      - name: Aplicar migrações
        run: pnpm prisma:deploy
      - name: Testes de integração
        run: pnpm test:integration
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    needs: [frontend, api]
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem da API
        run: docker build -t pinfast-api ./pinfast-api
      - name: Build da imagem do frontend
        run: docker build -t pinfast-web .
